# Railway configuration for Dalal Platform
# Force rebuild - 2026-09-09-09-10 - PostgreSQL service exists, ensure connection
[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# PostgreSQL service "Postgres" exists in Railway project
# DATABASE_URL is automatically set by Railway environment
# Application will use PostgreSQL automatically

[variables]
DEBUG = "false"
PORT = "8080"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
DJANGO_SETTINGS_MODULE = "dalal_project.settings"
ALLOW_SQLITE_FALLBACK = "false"
ALLOWED_HOSTS = "muqq.up.railway.app"
GUNICORN_WORKERS = "2"
GUNICORN_THREADS = "4"
GUNICORN_TIMEOUT = "300"
SECRET_KEY = "django-insecure-production-secret-key-minimum-50-characters-long-change-this-immediately"

# CRITICAL: Database Protection Settings
# - ALLOW_SQLITE_FALLBACK = false: Prevents SQLite in production
# - settings.py validates DATABASE_URL and rejects SQLite in production
# - entrypoint.sh uses migrate --noinput only (never flush or reset)
# - PostgreSQL service "Postgres" is linked and required for production