# Railway configuration for Dalal Platform
# Force rebuild - 2026-09-09-09-30 - Use Dockerfile with entrypoint DATABASE_URL fix
[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# PostgreSQL service "Postgres" exists in Railway project
# entrypoint.sh will set DATABASE_URL from Railway environment
# DATABASE_URL is automatically set by Railway from PostgreSQL service

[variables]
DEBUG = "false"
PORT = "8080"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
DJANGO_SETTINGS_MODULE = "dalal_project.settings"
ALLOW_SQLITE_FALLBACK = "false"
ALLOWED_HOSTS = "muqq.up.railway.app"
GUNICORN_WORKERS = "2"
GUNICORN_THREADS = "4"
GUNICORN_TIMEOUT = "300"
SECRET_KEY = "django-insecure-production-secret-key-minimum-50-characters-long-change-this-immediately"

# CRITICAL: Database Protection Settings
# - ALLOW_SQLITE_FALLBACK = false: Prevents SQLite in production
# - entrypoint.sh will set DATABASE_URL from Railway environment
# - PostgreSQL service "Postgres" is linked and required for production