[phases.build]
cmds = [
  "pip install -r requirements.txt",
  "pip install gunicorn",
  "python manage.py collectstatic --noinput"
]

[phases.start]
cmd = "bash entrypoint.sh"

[variables]
DEBUG = "false"
ALLOW_SQLITE_FALLBACK = "false"
PORT = "8080"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
DJANGO_SETTINGS_MODULE = "dalal_project.settings"
GUNICORN_WORKERS = "2"
GUNICORN_THREADS = "4"
GUNICORN_TIMEOUT = "300"
SECRET_KEY = "django-insecure-production-secret-key-minimum-50-characters-long-change-this-immediately"

# CRITICAL: Force PostgreSQL and prevent SQLite
# Use Railway's DATABASE_URL reference from PostgreSQL service
# This overrides any Railway Variables that might set DATABASE_URL to empty
DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# ALLOW_SQLITE_FALLBACK = false prevents SQLite fallback in production
# These settings ensure PostgreSQL is used even if Railway Variables are misconfigured
