# This file is DISABLED - Using Dockerfile instead
# To use Nixpacks, change builder in railway.toml to "NIXPACKS"
# Force Railway rebuild - 2026-08-24-15-05 - Fix static files handling
[phases.setup]
nixPkgs = ["python311", "gcc", "pkg-config", "postgresql"]

[phases.build]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt",
    "echo '=== Creating directories ==='",
    "mkdir -p static staticfiles logs media",
    "echo '=== Running Django commands ==='",
    "python manage.py migrate --noinput",
    "python manage.py collectstatic --noinput --clear",
]

[phases.start]
cmd = "python run_server.py"

[static]
include = ["templates/**", "static/**", "staticfiles/**"]

[variables]
DEBUG = "False"
PORT = "8080"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
DJANGO_SETTINGS_MODULE = "dalal_project.settings"
ALLOW_SQLITE_FALLBACK = "False"
GUNICORN_WORKERS = "2"
GUNICORN_TIMEOUT = "120"