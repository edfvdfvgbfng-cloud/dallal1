[phases.build]
cmds = ["pip install -r requirements.txt", "python manage.py collectstatic --noinput"]

[phases.start]
cmd = "bash entrypoint.sh"

[variables]
DEBUG = "false"
ALLOW_SQLITE_FALLBACK = "false"
PORT = "8080"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
DJANGO_SETTINGS_MODULE = "dalal_project.settings"
GUNICORN_WORKERS = "2"
GUNICORN_THREADS = "4"
GUNICORN_TIMEOUT = "300"

# CRITICAL: Force PostgreSQL and prevent SQLite
# DATABASE_URL will be automatically set by Railway from PostgreSQL service
# Do NOT set DATABASE_URL here - Railway will set it automatically
# ALLOW_SQLITE_FALLBACK = false prevents SQLite fallback in production

# Override Railway Variables if they exist
# These settings ensure PostgreSQL is used even if Railway Variables are misconfigured
