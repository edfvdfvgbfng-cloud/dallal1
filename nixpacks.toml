[phases.setup]
nixPkgs = ["python311", "postgresql", "redis"]

[phases.build]
cmds = ["python -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[phases.release]
cmds = [". /opt/venv/bin/activate && python manage.py migrate --noinput || true && python manage.py collectstatic --noinput || true"]

[start]
cmd = "gunicorn dalal_project.wsgi:application --bind 0.0.0.0 --port $PORT --workers 1 --timeout 180"

[env]
DJANGO_SETTINGS_MODULE = "dalal_project.settings"
PYTHONPATH = "/app"

[static]
# Static files will be served by Whitenoise