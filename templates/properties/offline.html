{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d9488">
  <title>غير متصل — دلال</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #0B0B0B 0%, #12352f 100%);
      color: #f5f5f5;
      font-family: Cairo, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 420px;
    }
    h1 { font-size: 1.6rem; margin-bottom: .75rem; }
    p { opacity: .85; line-height: 1.7; }
    button {
      margin-top: 1.5rem;
      background: #0d9488;
      color: #fff;
      border: 0;
      padding: .75rem 1.5rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>أنت غير متصل حالياً</h1>
    <p>تحقق من اتصال الإنترنت ثم أعد المحاولة. يمكنك متابعة تصفح الصفحات التي زرتها سابقاً عند توفرها في الذاكرة المؤقتة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
