{% extends 'properties/base.html' %}

{% block title %}حجز موعد مع {{ broker.display_name }}{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card" style="max-width: 800px; margin: 40px auto;">
    <div class="form-header" style="text-align: center; margin-bottom: 30px;">
      <h1 style="font-size: 2rem; color: var(--text); margin: 0 0 10px 0;">📅 حجز موعد مع الدلال</h1>
      <p style="color: var(--text-light); margin: 0;">{{ broker.display_name }}</p>
    </div>

    <form method="post" class="ad-form" style="background: var(--card-bg); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border);">
      {% csrf_token %}
      
      <div class="form-section" style="margin-bottom: 30px;">
        <h3 style="color: var(--text); margin: 0 0 20px 0; border-bottom: 2px solid var(--border); padding-bottom: 10px;">معلومات الموعد</h3>
        
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">نوع الموعد *</label>
          <select name="appointment_type" class="form-control" required>
            <option value="">اختر نوع الموعد</option>
            <option value="property_viewing">معاينة عقار</option>
            <option value="phone_call">مكالمة هاتفية</option>
            <option value="meeting">اجتماع</option>
            <option value="video_call">مكالمة فيديو</option>
            <option value="office_visit">زيارة المكتب</option>
          </select>
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">العقار (اختياري)</label>
          <select name="property" class="form-control">
            <option value="">بدون عقار محدد</option>
            {% for property in broker_properties %}
              <option value="{{ property.id }}">{{ property.display_title }}</option>
            {% endfor %}
          </select>
          <small style="color: var(--text-light);">اختر العقار إذا كان الموعد لمعاينة عقار محدد</small>
        </div>
        
        <div class="form-row" style="display: flex; gap: 20px;">
          <div class="form-group" style="margin-bottom: 20px; flex: 1;">
            <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">تاريخ الموعد *</label>
            <input type="date" name="appointment_date" class="form-control" required min="{{ min_date }}">
          </div>
          
          <div class="form-group" style="margin-bottom: 20px; flex: 1;">
            <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">وقت الموعد *</label>
            <input type="time" name="appointment_time" class="form-control" required>
          </div>
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">المدة (دقائق)</label>
          <input type="number" name="duration" class="form-control" value="30" min="15" max="180">
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">الموقع</label>
          <input type="text" name="location" class="form-control" placeholder="مثال: مكتب الدلال، عنوان العقار، إلخ">
        </div>
      </div>

      <div class="form-section" style="margin-bottom: 30px;">
        <h3 style="color: var(--text); margin: 0 0 20px 0; border-bottom: 2px solid var(--border); padding-bottom: 10px;">ملاحظات</h3>
        
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">ملاحظاتك</label>
          <textarea name="notes" class="form-control" rows="4" placeholder="اكتب أي تفاصيل إضافية عن الموعد..."></textarea>
        </div>
      </div>

      <div class="form-actions" style="display: flex; gap: 15px; justify-content: flex-end;">
        <button type="submit" class="btn btn-primary" style="background: var(--gradient-primary); color: white; border: none; padding: 12px 24px; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer;">حجز الموعد</button>
        <a href="{{ broker.get_absolute_url }}" class="btn btn-outline" style="background: transparent; color: var(--text); border: 2px solid var(--border); padding: 12px 24px; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none;">إلغاء</a>
      </div>
    </form>
  </div>
</div>

<style>
.form-control {
  width: 100%;
  padding: 12px 15px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: white;
  color: var(--text);
  font-size: 1rem;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
}

.btn-outline:hover {
  border-color: var(--primary);
  color: var(--primary);
}
</style>
{% endblock %}
