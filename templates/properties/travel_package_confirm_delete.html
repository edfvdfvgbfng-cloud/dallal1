{% extends 'properties/base.html' %}
{% load static %}

{% block title %}حذف رحلة - دلال{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">تأكيد الحذف</h2>
                    
                    <div class="alert alert-warning">
                        <h5>هل أنت متأكد من حذف الرحلة "{{ package.title }}"؟</h5>
                        <p>هذا الإجراء لا يمكن التراجع عنه.</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> نعم، احذف الرحلة
                        </button>
                        <a href="{% url 'travel_package_detail' package.pk package.slug %}" class="btn btn-secondary">
                            إلغاء
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
