{% extends 'properties/base.html' %}

{% block title %}حجز موعد مع الإدارة{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card" style="max-width: 800px; margin: 40px auto;">
    <div class="form-header" style="text-align: center; margin-bottom: 30px;">
      <h1 style="font-size: 2rem; color: var(--text); margin: 0 0 10px 0;">📅 حجز موعد مع الإدارة</h1>
      <p style="color: var(--text-light); margin: 0;">املأ النموذج أدناه لحجز موعد مع إدارة المنصة</p>
    </div>

    <form method="post" class="ad-form" style="background: var(--card-bg); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border);">
      {% csrf_token %}

      <div class="form-section" style="margin-bottom: 30px;">
        <h3 style="color: var(--text); margin: 0 0 20px 0; border-bottom: 2px solid var(--border); padding-bottom: 10px;">معلومات الموعد</h3>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">نوع الموعد *</label>
          <select name="appointment_type" class="form-control" required>
            <option value="">اختر نوع الموعد</option>
            <option value="phone_call">مكالمة هاتفية</option>
            <option value="meeting">اجتماع</option>
            <option value="video_call">مكالمة فيديو</option>
            <option value="office_visit">زيارة المكتب</option>
            <option value="consultation">استشارة</option>
          </select>
        </div>

        <div class="form-row" style="display: flex; gap: 20px;">
          <div class="form-group" style="margin-bottom: 20px; flex: 1;">
            <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">تاريخ الموعد *</label>
            <input type="date" name="appointment_date" class="form-control" required min="{{ min_date }}">
          </div>

          <div class="form-group" style="margin-bottom: 20px; flex: 1;">
            <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">وقت الموعد *</label>
            <input type="time" name="appointment_time" class="form-control" required>
          </div>
        </div>

        <div class="form-row" style="display: flex; gap: 20px;">
          <div class="form-group" style="margin-bottom: 20px; flex: 1;">
            <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">المدة (دقائق)</label>
            <select name="duration" class="form-control">
              <option value="15">15 دقيقة</option>
              <option value="30" selected>30 دقيقة</option>
              <option value="45">45 دقيقة</option>
              <option value="60">ساعة</option>
              <option value="90">ساعة ونصف</option>
              <option value="120">ساعتين</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 20px; flex: 1;">
            <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">الأولوية</label>
            <select name="priority" class="form-control">
              <option value="low">منخفض</option>
              <option value="medium" selected>متوسط</option>
              <option value="high">عالي</option>
              <option value="urgent">عاجل</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">الموقع</label>
          <input type="text" name="location" class="form-control" value="المكتب الرئيسي" placeholder="الموقع المفضل للموعد">
        </div>
      </div>

      <div class="form-section" style="margin-bottom: 30px;">
        <h3 style="color: var(--text); margin: 0 0 20px 0; border-bottom: 2px solid var(--border); padding-bottom: 10px;">معلومات إضافية</h3>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text); font-weight: 600;">ملاحظات</label>
          <textarea name="notes" class="form-control" rows="4" placeholder="أي ملاحظات إضافية تود إضافتها حول الموعد..."></textarea>
        </div>
      </div>

      <div style="display: flex; gap: 15px; justify-content: flex-end;">
        <a href="{% url 'appointment_booking_landing' %}" class="btn btn-secondary" style="padding: 12px 30px; background: var(--primary-dark); color: white; border: none; border-radius: var(--radius); text-decoration: none; font-weight: 600;">
          رجوع
        </a>
        <button type="submit" class="btn btn-primary" style="padding: 12px 30px; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer;">
          تأكيد الحجز
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
